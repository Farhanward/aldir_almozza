[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aldir-almozza"
version = "1.0.0"
authors = [{ name = "Farhan Almutairi", email = "far7an.o88@gmail.com" }]
description = "Collaborative threat signal aggregator."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }

[project.scripts]
aldir-almozza = "aldir_almozza.cli:main"

[tool.setuptools]
packages = ["aldir_almozza"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
